<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light"><title>Lecture2Exam</title>
  <link rel="stylesheet" href="vendor/katex/katex.min.css"><link rel="stylesheet" href="styles.css">
  <script src="vendor/katex/katex.min.js" defer></script>
  <script src="vendor/katex/contrib/auto-render.min.js" defer></script>
  <script src="i18n.js" defer></script><script src="logic.js" defer></script><script src="history.js" defer></script>
  <script src="api.js" defer></script><script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#app">跳到主要内容</a>
  <header class="app-bar"><a class="app-brand" href="/">Lecture2Exam</a><span id="active-bank-name" hidden></span><div class="language-picker" role="group" aria-label="界面语言 / Interface language"><button type="button" data-language="zh" lang="zh-CN" aria-pressed="true">中文</button><span aria-hidden="true">/</span><button type="button" data-language="en" lang="en" aria-pressed="false">English</button></div><span id="save-status" role="status"></span><button class="button button--quiet" id="switch-bank" hidden>切换题库</button></header>
  <div id="notice" role="alert" hidden></div>
  <main id="app" tabindex="-1"><p>正在打开本地题库…</p></main>
  <div id="live-status" class="sr-only" aria-live="polite"></div>
  <input id="progress-import" type="file" accept=".json,application/json" hidden>
  <dialog id="confirm-dialog" aria-labelledby="dialog-title"><form method="dialog" class="dialog-panel"><div class="dialog-topline"><p class="eyebrow">Lecture2Exam</p><button type="button" id="exam-settings-open" class="button button--quiet" data-action="exam-settings" hidden>考试设置</button></div><h2 id="dialog-title"></h2><p id="dialog-body"></p><div class="dialog-actions"><button class="button button--quiet" value="cancel">取消</button><button id="dialog-confirm" class="button button--primary" value="confirm">确认</button></div></form></dialog>
  <dialog id="exam-settings-dialog" aria-labelledby="exam-settings-title"><form id="exam-settings-form" class="dialog-panel"><div id="exam-settings-fields"></div></form></dialog>
<dialog id="delete-dialog" aria-labelledby="delete-title"><div class="dialog-panel"><h2 id="delete-title">删除题库</h2><p id="delete-name"></p><p id="delete-description">删除题库记录仅从最近列表移除，题库文件和做题记录会保留。</p><div class="dialog-actions"><button class="button button--quiet" data-action="delete-registration">删除题库记录</button><button class="button button--primary" data-action="delete-whole-bank">删除整个题库</button><form method="dialog"><button class="button button--quiet">取消</button></form></div></div></dialog>
</body>
</html>
